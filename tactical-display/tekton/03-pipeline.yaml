apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-tactical-display
  namespace: demo
spec:
  params:
    - name: git-url
      type: string
      description: Git repository URL
      default: https://github.com/bgregori/ai-demo.git

    - name: git-revision
      type: string
      description: Git revision to checkout
      default: main

  workspaces:
    - name: shared-workspace
      description: Shared workspace for source code

  results:
    - name: commit-sha
      description: Git commit SHA
      value: $(tasks.fetch-repository.results.COMMIT)

  tasks:
    - name: fetch-repository
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: DELETE_EXISTING
          value: "true"
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: maven-build-backend
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: maven
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - fetch-repository
      params:
        - name: GOALS
          value:
            - clean
            - package
            - -DskipTests
        - name: SUBDIRECTORY
          value: tactical-display/backend
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: buildah-backend
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - maven-build-backend
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/demo/tactical-backend:$(tasks.fetch-repository.results.COMMIT)
        - name: DOCKERFILE
          value: ./tactical-display/backend/src/main/docker/Dockerfile.jvm
        - name: CONTEXT
          value: ./tactical-display/backend
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: buildah-frontend
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - fetch-repository
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/demo/tactical-frontend:$(tasks.fetch-repository.results.COMMIT)
        - name: DOCKERFILE
          value: ./tactical-display/frontend/Dockerfile
        - name: CONTEXT
          value: ./tactical-display/frontend
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: update-values
      runAfter:
        - buildah-backend
        - buildah-frontend
      params:
        - name: git-url
          value: $(params.git-url)
      taskSpec:
        params:
          - name: git-url
        workspaces:
          - name: source
        steps:
          - name: update-tags
            image: registry.access.redhat.com/ubi9/ubi:latest
            workingDir: $(workspaces.source.path)
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-push-secret
                    key: token
            script: |
              #!/bin/bash
              set -e

              # Install git first
              echo "Installing git..."
              dnf install -y git -q

              # Configure git safe directory (needed for Tekton workspace)
              git config --global --add safe.directory /workspace/source
              git config --global user.email "pipeline@tekton.dev"
              git config --global user.name "Tekton Pipeline"

              # Get current commit SHA (full SHA to match Buildah tags)
              COMMIT_SHA=$(git rev-parse HEAD)
              echo "Updating values.yaml with tag: ${COMMIT_SHA}"

              # Update both backend and frontend tags
              sed -i "s|tag: [a-z0-9]*  # Updated by pipeline|tag: ${COMMIT_SHA}  # Updated by pipeline|g" tactical-display/helm/tactical-display/values.yaml

              echo "Updated values.yaml:"
              grep "tag:" tactical-display/helm/tactical-display/values.yaml

              # Commit changes
              git add tactical-display/helm/tactical-display/values.yaml

              if git diff --cached --quiet; then
                echo "No changes to commit"
                exit 0
              fi

              git commit -m "Update image tags to ${COMMIT_SHA} [skip ci]"

              # Push using GitHub token
              echo "Pushing changes to GitHub..."
              # Extract repo path from git URL (https://github.com/user/repo.git)
              REPO_PATH=$(echo "$(params.git-url)" | sed 's|https://github.com/||' | sed 's|.git$||')
              git remote set-url origin "https://${GITHUB_TOKEN}@github.com/${REPO_PATH}.git"
              git push origin HEAD:main
              echo "✓ Changes pushed to GitHub - ArgoCD will auto-deploy"
      workspaces:
        - name: source
          workspace: shared-workspace

  finally:
    - name: report-status
      params:
        - name: message
          value: "Pipeline completed. Backend and Frontend images built."
      taskSpec:
        params:
          - name: message
        steps:
          - name: echo
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              echo "$(params.message)"
              echo "✓ Images built with commit SHA tag"
